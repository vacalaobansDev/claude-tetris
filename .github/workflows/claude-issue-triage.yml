name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    # `issues` events only fire for the issue itself (title/body), not for
    # comments on it (those are `issue_comment` events) — so this already
    # only runs for the "issue principal", per the request.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          claude_args: '--allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'

          prompt: |
            You are triaging GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            Issue title: ${{ github.event.issue.title }}
            Issue body:
            ${{ github.event.issue.body }}

            Do the following:

            1. Read CLAUDE.md and the relevant source files (game.js, index.html,
               style.css) to understand the codebase and figure out which part of
               the game the issue is actually about.

            2. Choose and apply appropriate labels from the repository's EXISTING
               label set only (run `gh label list` to see them — do not invent or
               create new labels). Typical ones include `bug`, `enhancement`,
               `documentation`, `question`, `accessibility`, `good first issue`,
               `help wanted`, `invalid`, `duplicate`, `wontfix`. Apply as many as
               are genuinely relevant with:
               `gh issue edit ${{ github.event.issue.number }} --add-label "label-one,label-two"`
               Do not remove labels that are already on the issue unless they are
               clearly wrong given the issue content.

            3. Post one comment on the issue (via `gh issue comment`) with a general
               diagnosis to help a developer plan the fix later. Do NOT write or
               propose actual code changes — this is diagnosis only. Structure the
               comment as:

               ## Diagnosis

               **Summary:** one or two sentences restating the problem/request in
               your own words.

               **Likely area:** which file(s) and function(s) (per CLAUDE.md's
               architecture section, e.g. `collide`, `tryRotate`, `lockPiece`,
               `clearLines`, `draw`, input handling, etc.) are most likely involved,
               and why.

               **Root cause hypothesis / considerations:** your best-effort
               reasoning about what's going on (for a bug) or what would need to
               change (for a feature request), including any tunable constants or
               edge cases from CLAUDE.md that are relevant.

               **Open questions:** anything that's unclear from the issue and would
               need clarification before implementation (omit this section if
               there's nothing to ask).

            Only touch this one issue. Do not open pull requests or modify any
            files in the repository.
